spring:
  application:
    name: crm-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:crm}
    username: ${DB_USER:crm}
    password: ${DB_PASSWORD:crm}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:change-me-dev-only-secret-change-me-dev-only}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}

llm:
  base-url: ${LLM_BASE_URL:https://api.deepseek.com}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:deepseek-chat}

whatsapp:
  verify-token: ${WHATSAPP_VERIFY_TOKEN:}
  app-secret: ${WHATSAPP_APP_SECRET:}
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}

instagram:
  verify-token: ${INSTAGRAM_VERIFY_TOKEN:}
  app-secret: ${INSTAGRAM_APP_SECRET:}
  access-token: ${INSTAGRAM_ACCESS_TOKEN:}
  ig-user-id: ${INSTAGRAM_IG_USER_ID:}

logging:
  level:
    com.doorfox: ${APP_LOG_LEVEL:INFO}
